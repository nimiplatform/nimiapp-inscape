app_id: nimi.inscape
display_name: Inscape
version: 0.1.7
profile: standalone
manifest_role: submitted-input
app_access:
  - runtime.consume
local_development:
  electron:
    renderer_origin: http://127.0.0.1:1431
metadata:
  summary: 面向成年人的本地性格探索与日常反思工具，用认知功能视角理解自己和关系。
  icon: assets/app-icon.png
  readme: APP_GUIDE.md
  release_notes: RELEASE_NOTES.md
  author: Nimi Team
  homepage_url: https://github.com/nimiplatform/nimiapp-inscape
  support_url: https://github.com/nimiplatform/nimiapp-inscape/issues
capability_contract_refs:
  - text.generate
required_standardized_feature_refs: []
safety_profile:
  intended_audience: adult
  content_descriptors: []
  ai:
    direct_interaction: true
    interaction_notice: absent
    risk_features: []
    subject_notice: not-applicable
    outputs:
      - modality: text
        exposure: exportable
        publication_control: not-applicable
        in_product_notice: absent
        export_visible_marking: absent
        machine_readable_marking: absent
  data_practices:
    publisher_direct_external_network: false
    telemetry: []
    third_party_account: none
    user_content_sharing: none
    commercial_features: []
    sensitive_data_categories: []
  high_impact_decision_uses: []
storage_policy:
  kind: app-owned-os-storage
  os_storage_disclosure:
    - path_pattern: <OS application-data>/nimi.inscape/inscape.db
      purpose: Local SQLite storage for adult attestation, profiles, relationships and reflections. Retained after Nimi uninstall; cleared from Inscape settings.
      expected_size_band: Starts at a few KiB and grows with saved records; no App-enforced storage cap.
    - path_pattern: <OS application-data>/nimi.inscape/inscape-quarantine-pending.json*
      purpose: Confirmed quarantine write intent for restart recovery during a failed SQLite write. Removed after the real commit or explicit local-data reset; never used for analysis.
      expected_size_band: A transient snapshot of the affected local space, growing with saved records.
    - path_pattern: <OS application-data>/nimi.inscape/development/*/inscape.db
      purpose: Isolated development SQLite space per Desktop Host profile, retained across an explicit registration resume. Never reads or converts installed or older development data.
      expected_size_band: Starts at a few KiB and grows with saved development records.
    - path_pattern: <OS application-data>/nimi.inscape/development/*/inscape-quarantine-pending.json*
      purpose: Recovery-only confirmed quarantine intent for the isolated development space. Removed after commit or explicit local-data reset.
      expected_size_band: A transient snapshot of the affected development space.
