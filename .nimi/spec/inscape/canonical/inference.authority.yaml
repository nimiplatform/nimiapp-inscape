format: nimicoding.authority/v2
owner: team.inscape
scope: inscape.inference
units:
  - id: definition.inscape.inference.posterior-distribution
    kind: definition
    title: Posterior distribution
    meaning: Type is a posterior distribution updated only by user-driven signals, with an explicitly anti-fixation long-term view.
  - id: definition.inscape.inference.proposal-parser
    kind: definition
    title: Proposal parser
    meaning: The fail-close parser for AI posterior-update proposals drops a proposal that fails JSON or schema validation whole, with no partial merge, fabricated value, or retry into success.
  - id: rule.inscape.inference.r001
    kind: rule
    title: Distributional type inference
    modality: must
    statement: Represent type as a posterior distribution, update it only from user-driven signals, and keep the long-term view explicitly anti-fixation.
    condition: Always.
    failure: Reject any update not grounded in a user-driven signal and leave the posterior unchanged.
    relations:
      - type: applies_to
        target: definition.inscape.inference.posterior-distribution
  - id: rule.inscape.inference.r002
    kind: rule
    title: Fail-close proposal parsing
    modality: must
    statement: Validate each complete AI posterior-update proposal as JSON and against its schema before applying any part of it.
    condition: When an AI posterior-update proposal is received.
    failure: Drop the whole invalid proposal with no partial merge, fabricated value, or retry into success.
    relations:
      - type: applies_to
        target: definition.inscape.inference.proposal-parser
  - id: rule.inscape.inference.r003
    kind: rule
    title: Explicit update acceptance
    modality: must
    statement: Apply a posterior update only after explicit user acceptance; the default state is no update.
    condition: When a posterior update is proposed.
    failure: Leave the posterior unchanged unless the user explicitly accepts the proposal.
    relations:
      - type: applies_to
        target: definition.inscape.inference.posterior-distribution
  - id: rule.inscape.inference.r004
    kind: rule
    title: Bounded reflection calibration
    modality: must
    statement: Supply the complete current strengths, signed dichotomy values, confidences, and polarity meanings to the reflection proposer; validate the complete proposal before display and again before acceptance, allowing an absolute change of at most 0.10 in each strength, dichotomy value, or confidence per reflection; persist at most one accepted contribution per reflection and remove it when its feedback is withdrawn or its source is edited or deleted.
    condition: When a reflection proposes a profile calibration.
    failure: Reject the whole out-of-bounds proposal without clamping or partially applying values, and leave the current profile unchanged.
    relations:
      - type: applies_to
        target: definition.inscape.inference.posterior-distribution
  - id: rule.inscape.inference.r005
    kind: rule
    title: Coherent and revisable profile derivation
    modality: must
    statement: Derive the leading four-letter type from the signs of E_I, S_N, T_F, and J_P only when each magnitude is at least 0.20 and confidence at least 0.25; otherwise leave the leading type and Beebe inference null. Derive Beebe positions from the current leading type. Display function activity separately and never infer a four-letter type by sorting function strengths. Rebuild the current profile from the user-selected baseline and the remaining accepted reflection contributions; saturate rebuilt totals to their domain bounds without repairing invalid proposals. Replacing the baseline withdraws previous contributions while preserving notes and readings.
    condition: When profile evidence, an accepted reflection contribution, or the user-selected baseline changes.
    failure: Reject invalid proposals whole and never retain stale type or Beebe labels as current inference.
    relations:
      - type: applies_to
        target: definition.inscape.inference.posterior-distribution
