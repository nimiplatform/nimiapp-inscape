format: nimicoding.authority/v2
owner: team.inscape
scope: inscape.privacy
units:
  - id: definition.inscape.privacy.adult-attestation
    kind: definition
    title: Adult attestation
    meaning: The persistence-layer 18+ attestation gate prevents a non-adult subject from being persisted unless adult attestation is explicitly true.
  - id: definition.inscape.privacy.token-custody
    kind: definition
    title: Token custody
    meaning: Access and refresh token custody is runtime-owned with no app-held token surface.
  - id: definition.inscape.privacy.rewrite-defence
    kind: definition
    title: Rewrite defence
    meaning: The CommunicationRewrite four-layer anti-manipulation defence consists of a prompt-injection guard, keyword classifier, mandatory disclaimer, and history audit, with refusal of money, employment, sexual-consent, and decision-pressure contexts.
  - id: rule.inscape.privacy.r001
    kind: rule
    title: Persistence adult gate
    modality: must
    statement: Gate every persisted space and subject at the persistence layer so that unattested or non-adult subject data cannot be written.
    condition: When an InscapeSpace snapshot is persisted.
    failure: Reject the persistence write when adult attestation is not explicitly true.
    relations:
      - type: applies_to
        target: definition.inscape.privacy.adult-attestation
  - id: rule.inscape.privacy.r002
    kind: rule
    title: Runtime token custody
    modality: must
    statement: The runtime retains custody of access and refresh tokens and the app holds no token surface.
    condition: Always.
    failure: Reject any app-side token storage, exposure, or transfer before token material reaches the app.
    relations:
      - type: applies_to
        target: definition.inscape.privacy.token-custody
  - id: rule.inscape.privacy.r003
    kind: rule
    title: Under-18 quarantine
    modality: must
    statement: "Quarantine affected subjects on actual knowledge that they are under 18. Treat lexical age matches only as candidates: pause the related AI request and ask the user to confirm the person and current age before quarantine. Let the user correct quoted, historical or hypothetical context; bind each stored correction to its exact source and invalidate it on editing. Support manual re-declaration. Confirmed self quarantine closes all space analysis without restoring the confirmed minor to active use; expose deletion but no guardian-facing UI or minor-mode surface."
    condition: When the app gains actual knowledge that a person is under 18.
    failure: Stop subject processing, prevent the subject row from persisting, and place the affected material in quarantine.
    relations:
      - type: applies_to
        target: definition.inscape.data-model.quarantine
  - id: rule.inscape.privacy.r004
    kind: rule
    title: Rewrite anti-manipulation defence
    modality: must
    statement: CommunicationRewrite applies a prompt-injection guard, keyword classifier, mandatory disclaimer, and history audit and refuses money, employment, sexual-consent, and decision-pressure contexts.
    condition: When a communication rewrite is requested.
    failure: Refuse a guarded or disallowed rewrite request before generation and record the refusal for history audit.
    relations:
      - type: applies_to
        target: definition.inscape.privacy.rewrite-defence
  - id: rule.inscape.privacy.r005
    kind: rule
    title: Restricted private persistence
    modality: must
    statement: Persist product data exclusively in Nimi-mediated private app storage and provide no telemetry sink.
    condition: Always.
    failure: Reject persistence outside Nimi-mediated private app storage and reject any telemetry emission.
    relations:
      - type: applies_to
        target: definition.inscape.data-model.persistence
  - id: rule.inscape.privacy.r006
    kind: rule
    title: Restricted renderer resources
    modality: must
    statement: Enforce a production renderer Content Security Policy that denies external connections, inline scripts, objects and frames; retain only resources needed by the local UI. Development exceptions permit the Vite refresh preamble and exact loopback HMR only.
    condition: When creating the renderer or building its document.
    failure: Block resources outside the declared policy and never relax the production policy to make a journey pass.
    relations:
      - type: applies_to
        target: definition.inscape.product.inscape-app
